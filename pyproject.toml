[tool.ruff]
line-length = 120
target-version = "py311"
src = ["agent/src", "sim", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "E741", "B008", "UP017", "UP031", "B905"]   # POC：允許單行 if/語句、短變數 l

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
