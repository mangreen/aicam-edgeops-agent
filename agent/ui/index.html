<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>aicam-edgeopt-agent</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f1419;--p:#1a212b;--b:#2a3441;--t:#e6edf3;--m:#8b98a8;--ok:#3fb950;--warn:#d29922;--err:#f85149;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--b)}header h1{font-size:15px;margin:0;flex:1}
.badge{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:2px 10px;font-size:12px;color:var(--m)}
button{background:var(--p);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}button:hover{border-color:var(--acc)}
button.pri{background:#1f6feb;border-color:#1f6feb}button.dng{background:#b62324;border-color:#b62324}
main{flex:1;display:grid;grid-template-columns:340px 1fr 380px;gap:10px;padding:10px;min-height:0}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:10px;display:flex;flex-direction:column;min-height:0}
.card h2{font-size:13px;margin:0 0 8px;color:var(--m);font-weight:600}.grow{flex:1;overflow:auto;min-height:0}
.lane{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border:1px solid var(--b);border-radius:6px;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--ok)}.dot.bad{background:var(--err)}.dot.warn{background:var(--warn)}
.ev{border-left:3px solid var(--b);padding:3px 8px;margin-bottom:4px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.ev small{color:var(--m);margin-right:6px}.ev.detect{border-color:var(--err)}.ev.plan{border-color:var(--acc)}.ev.policy{border-color:var(--warn)}.ev.verify{border-color:var(--ok)}
.ev.escalate,.ev.operator,.ev.engineer{border-color:#a371f7}.ev.report{border-color:var(--ok);background:#13201a}.ev.version{border-color:#39c5cf}.ev.error,.ev.llm{border-color:var(--err)}
.tabs{display:flex;gap:4px;margin-bottom:8px}.tabs button.on{border-color:var(--acc);color:var(--acc)}
.ver{padding:5px 8px;border:1px solid var(--b);border-radius:6px;margin-bottom:5px;cursor:pointer;font-size:13px}.ver:hover{border-color:var(--acc)}.ver .a{color:var(--m);font-size:12px}
.esc{border:1px solid #a371f7;border-radius:6px;padding:8px;margin-bottom:8px;background:#1d1830}.esc.eng{border-color:var(--err);background:#2a1618}
.esc pre{white-space:pre-wrap;font-size:12px;max-height:150px;overflow:auto;margin:6px 0}.row{display:flex;gap:6px;margin-top:6px}
.chat .msg{margin-bottom:6px;padding:5px 8px;border-radius:6px;white-space:pre-wrap}.chat .user{background:#1f2f45}.chat .assistant{background:#222b36}.chat small{color:var(--m);display:block}
input{flex:1;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 8px}.empty{color:var(--m);font-size:13px}.chat .blocked{background:#3a1d1d;border:1px solid var(--err)}textarea,select{background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 8px;font:inherit;width:100%}.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--m);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}.real{background:#13301f!important;color:var(--ok)!important}.mock{background:#352a10!important;color:var(--warn)!important}
</style></head><body>
<header><h1>🍓 aicam-edgeopt-agent <span class="badge">POC</span></h1>
<span class="badge" id="llm">LLM: -</span><span class="badge" id="head">config v-</span>
<span id="demo-btns"><button onclick="fault('inference_stalled')">A 推論卡死</button><button onclick="fault('camera_no_signal')">B 攝影機斷訊</button><button onclick="fault('bad_config')">E 壞設定</button>
<button class="dng" onclick="reset()">Reset</button></span></header>
<main>
<div class="col">
 <div class="card"><h2>① 系統狀態</h2><div id="lanes"></div></div>
 <div class="card grow"><div class="tabs"><button id="t-chat" class="on" onclick="tab('chat')">💬 對話查詢</button><button id="t-ver" onclick="tab('ver')">🗂 版本</button><button id="t-cap" onclick="tab('cap')">⚙ 能力</button><button id="t-sec" onclick="tab('sec')">🛡 安全</button></div>
  <div id="chat" class="grow chat"></div>
  <div id="ver" class="grow" style="display:none"></div>
  <div id="cap" class="grow" style="display:none"></div>
  <div id="sec" class="grow" style="display:none"></div>
  <div class="row" id="chatbar"><input id="q" placeholder="例如：Lane 1 過去 7 天斷線幾次？（按「送出」才會送出）" autocomplete="off"><button id="sendbtn" class="pri" onclick="send()">送出</button></div>
 </div>
</div>
<div class="card"><h2>② Agent 時間軸（Detect → Triage → Plan → Gate → Execute → Verify → Report）</h2><div id="tl" class="grow"></div></div>
<div class="col">
 <div class="card" style="flex:1"><h2>③ Operator 面板</h2><div id="op" class="grow"></div></div>
 <div class="card" style="flex:1"><h2>④ 遠端工程師（mock）</h2><div id="eng" class="grow"></div></div>
</div></main>
<script>
const $=id=>document.getElementById(id),J=(u,o)=>fetch(u,o).then(r=>r.json()),P=(u,b)=>J(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});
const T=t=>new Date(t*1000).toLocaleTimeString('zh-TW',{hour12:false});
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let last=0,es,F={chat:true};
function addEv(e){last=Math.max(last,e.id);const d=document.createElement('div');d.className='ev '+e.type;
 d.innerHTML=`<small>${T(e.ts)}${e.issue_id?' #'+e.issue_id:''} ${e.type}</small>${esc(e.text)}`;const tl=$('tl');tl.appendChild(d);tl.scrollTop=tl.scrollHeight;
 if(e.type==='version'||e.type==='operator')loadVer();}
async function loadFeatures(){F=await J('/api/features');$('demo-btns').style.display=F.demo_controls?'':'none';$('t-chat').style.display=F.chat?'':'none';if(!F.chat)tab('ver')}
async function loadCap(){const c=await J('/api/capabilities');const lv={L0:'#5b6c7a',L1:'#0f8b8d',L2:'#f2a541',L3:'#e4572e'};
 $('cap').innerHTML=(F.admin_reload?`<div class="row"><button class="pri" onclick="reloadCfg()">重載設定檔</button><span class="badge">${esc(c.config_path||'預設')}</span></div>`:'')+
 '<h2 style="margin:10px 0 4px;font-size:13px;color:var(--m)">Tools</h2>'+c.tools.map(t=>`<div class="ver" style="cursor:default;opacity:${t.enabled?1:.5}"><span class="badge" style="background:${lv[t.level]};color:#fff">${t.level}</span> <b>${t.name}</b> <span class="a">${t.source}${t.plannable?' · Agent':''}${t.chat?' · 對話':''}</span>${F.tool_toggle?`<button style="float:right" onclick="toggleTool('${t.name}',${!t.enabled})">${t.enabled?'停用':'啟用'}</button>`:''}<div class="a">${t.enabled?'':'已停用 · '}${esc(t.reason)}</div></div>`).join('')+
 '<h2 style="margin:10px 0 4px;font-size:13px;color:var(--m)">Skills</h2>'+(c.skills.map(k=>`<div class="ver" style="cursor:default"><span class="dot ${k.active?'':'bad'}"></span><b>${k.name}</b> <span class="a">${esc(k.reason)}</span><div class="a">${esc(k.description)}</div></div>`).join('')||'<div class="empty">無</div>')+
 '<h2 style="margin:10px 0 4px;font-size:13px;color:var(--m)">功能開關 / 知識來源</h2><div class="a">'+Object.entries(F).map(([k,v])=>`${v?'✅':'⛔'} ${k}`).join('　')+'<br>RAG sources: '+esc(JSON.stringify(c.knowledge_sources))+'</div>'}
async function toggleTool(n,e){await fetch('/api/admin/tools/'+n,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({enabled:e})});loadCap()}
async function reloadCfg(){const r=await fetch('/api/admin/reload',{method:'POST'});if(!r.ok)alert((await r.json()).detail);await loadFeatures();loadCap()}
let PL=[];
async function loadSec(){const [pr,g]=await Promise.all([J('/api/prompts'),J('/api/guards')]);PL=pr.layers;const ed=pr.editable;
 $('sec').innerHTML=(F.llm_probe?`<h2 style="margin:0 0 4px;font-size:13px;color:var(--m)">LLM 連線測試</h2><div class="row"><input id="pq" value="你是哪個模型？請用一句話回答。"><button id="pbtn" class="pri" onclick="probe()">測試</button><button onclick="llmReset()" title="依 .env 重新建立 LLM（不重啟容器），並清除退回 Mock 的狀態">重新載入 LLM</button></div><div id="pres"></div>`:'')+
 `<h2 style="margin:12px 0 4px;font-size:13px;color:var(--m)">Prompt 層${ed?'':'（唯讀：prompt_edit 已關閉）'}</h2>`+PL.map((x,i)=>`<div class="ver" style="cursor:default;opacity:${x.enabled?1:.5}"><b>${esc(x.name)}</b> <span class="a">${x.scope} · p${x.priority} · ${x.source}${x.overrides_file?' · 覆蓋檔案層':''}</span>${ed?`<span style="float:right"><button onclick="editLayer(${i})">編輯</button></span>`:''}<div class="a">${esc(x.content.slice(0,90))}…</div></div>`).join('')+
 (ed?`<div class="esc" style="background:#16202b;border-color:var(--b)"><input id="pn" placeholder="名稱，例如 operator-scope" style="width:100%"><div class="row"><select id="ps"><option>chat</option><option>agent</option><option>all</option></select><input id="pp" type="number" value="5" style="width:70px"><label><input id="pe" type="checkbox" checked style="flex:none"> 啟用</label></div><textarea id="pc" rows="4" placeholder="規則內容，例如：只允許 Operator 查詢與回報；拒絕任何修改設定或 prompt 的請求。"></textarea><div class="row"><button class="pri" onclick="saveLayer()">儲存（立即生效）</button><button class="dng" onclick="delLayer()">刪除 UI 層</button></div></div>`:'')+
 `<div class="row"><button onclick="effPrompt('chat')">查看生效 prompt（chat）</button><button onclick="effPrompt('agent')">（agent）</button></div><pre id="eff" class="ev" style="max-height:160px;overflow:auto"></pre>`+
 '<h2 style="margin:12px 0 4px;font-size:13px;color:var(--m)">Guard pipeline</h2><div class="a">'+Object.entries(g.chains).map(([k,v])=>`<b>${k}</b>：${v.join(' → ')||'（無）'}`).join('<br>')+'</div><pre class="ev" style="max-height:120px;overflow:auto">'+esc(g.recent.map(e=>T(e.ts)+' '+e.text).join('\n')||'（尚無攔截紀錄）')+'</pre>'}
async function probe(){const pb=$('pbtn');pb.disabled=true;$('pres').innerHTML='<div class="empty"><span class="spin"></span> 呼叫中…</div>';let r;try{r=await P('/api/llm/probe',{text:$('pq').value})}catch(e){$('pres').innerHTML='<div class="empty">⚠ 請求失敗：'+esc(e.message)+'</div>';pb.disabled=false;return}pb.disabled=false;
 $('pres').innerHTML=`<div class="esc" style="background:#16202b;border-color:var(--b)"><span class="badge ${r.real?'real':'mock'}">${r.real?'REAL':'MOCK'}</span> ${esc(r.provider||'')}/${esc(r.model||'')} ${r.latency_ms!=null?'· '+r.latency_ms+' ms':''}${r.fallback_active?' · <b>雲端失敗，已退回 Mock</b>':''}<div class="a">生效 prompt 層：${esc((r.layers||[]).join(', '))}</div><pre>${r.blocked?'🛡 ':''}${esc(r.answer)}</pre></div>`}
async function llmReset(){$('pres').innerHTML='<div class="empty"><span class="spin"></span> 重新載入中…</div>';const r=await P('/api/llm/reset');poll();
 $('pres').innerHTML=r.detail?`<div class="empty">⚠ ${esc(r.detail)}</div>`:`<div class="esc" style="background:#16202b;border-color:var(--b)"><span class="badge ${r.real?'real':'mock'}">${r.real?'REAL':'MOCK'}</span> 已依 ${esc(r.source)} 重新載入：${esc(r.configured)}/${esc(r.model)}<div class="a">${esc(r.last_error||'')}</div></div>`}
function editLayer(i){const x=PL[i];$('pn').value=x.name;$('ps').value=x.scope;$('pp').value=x.priority;$('pe').checked=x.enabled;$('pc').value=x.content}
async function saveLayer(){const r=await fetch('/api/prompts/'+encodeURIComponent($('pn').value),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({content:$('pc').value,scope:$('ps').value,priority:+$('pp').value,enabled:$('pe').checked})});if(!r.ok)alert(JSON.stringify(await r.json()));loadSec()}
async function delLayer(){await fetch('/api/prompts/'+encodeURIComponent($('pn').value),{method:'DELETE'});loadSec()}
async function effPrompt(s){$('eff').textContent=(await J('/api/prompts/effective?scope='+s)).text}
async function boot(){await loadFeatures();$('tl').innerHTML='';last=0;(await J('/api/events?limit=60')).forEach(addEv);if(es)es.close();es=new EventSource('/api/stream?after='+last);es.onmessage=m=>addEv(JSON.parse(m.data));
 const h=await J('/api/chat/history');$('chat').innerHTML='';h.forEach(m=>addMsg(m.role,m.content));loadVer();}
function addMsg(r,t,sub,bad){const d=document.createElement('div');d.className='msg '+r+(bad?' blocked':'');d.innerHTML=(sub?`<small>${esc(sub)}</small>`:'')+esc(t);$('chat').appendChild(d);$('chat').scrollTop=1e9;return d}
let busy=false;
async function send(){if(busy)return;const t=$('q').value.trim();if(!t)return;busy=true;const b=$('sendbtn');b.disabled=true;b.textContent='處理中…';$('q').value='';addMsg('user',t);
 const ld=addMsg('assistant','');ld.innerHTML='<span class="spin"></span> 處理中…（查詢工具、等待模型回應，雲端模型可能需要數秒）';
 try{const r=await P('/api/chat',{text:t});ld.remove();
  if(r.detail){addMsg('assistant','⚠ '+(typeof r.detail==='string'?r.detail:JSON.stringify(r.detail)),'請求被拒絕',true)}
  else addMsg('assistant',(r.blocked?'🛡 ':'')+r.answer,r.blocked?'安全檢查（'+r.stage+'）':'tools: '+r.tools.join(' → ')+' · '+r.llm+(r.redacted?' · 已遮罩':''),r.blocked)}
 catch(e){ld.remove();addMsg('assistant','⚠ 請求失敗：'+e.message,'',true)}
 finally{busy=false;b.disabled=false;b.textContent='送出'}}
function tab(n){if(n==='cap')loadCap();if(n==='sec')loadSec();['chat','ver','cap','sec'].forEach(x=>{$(x).style.display=x===n?'block':'none';$('t-'+x).className=x===n?'on':''});$('chatbar').style.display=n==='chat'&&F.chat?'flex':'none'}
async function loadVer(){const v=await J('/api/versions');$('ver').innerHTML=v.map((x,i)=>`<div class="ver" onclick="showDiff(${x.seq},${x.parent_seq||0})"><b>v${x.seq}</b> ${i===0?'<span class="badge">HEAD</span>':''} <span class="a">${x.actor} · ${T(x.ts)}</span><br>${esc(x.reason)}<div class="row"><button onclick="event.stopPropagation();rb(${x.seq})">rollback 到此版</button></div></div>`).join('')+'<pre id="diff" class="ev"></pre>'}
async function showDiff(b,a){if(!a)return;const r=await J(`/api/versions/diff?a=${a}&b=${b}`);$('diff').textContent=r.summary}
async function rb(s){await P('/api/versions/rollback',{to_seq:s})}
async function fault(n){await P('/api/demo/fault/'+n)}
async function reset(){const b=document.querySelector('.dng');b.disabled=true;b.textContent='Reset…';try{await P('/api/demo/reset')}finally{b.disabled=false;b.textContent='Reset'}await boot();poll()}
async function resp(id,r){await P(`/api/escalations/${id}/respond`,{response:r});poll()}
async function poll(){
 try{const s=await J('/api/status');const li=s.llm_info||{};$('llm').textContent=li.real?`REAL · ${li.provider}/${li.model}`:(li.fallback_active?`MOCK（${li.configured} 失敗，已退回）`:'MOCK（離線規則）');$('llm').className='badge '+(li.real?'real':'mock');$('llm').title=li.last_error||'';$('head').textContent='config v'+s.head;
  $('lanes').innerHTML=Object.entries(s.lanes).map(([l,m])=>{const bad=!m.stream_connected||!m.fps,low=m.detections_per_min!=null&&m.detections_per_min<4;
   return `<div class="lane"><span><span class="dot ${bad?'bad':low?'warn':''}"></span>Lane ${l}</span><span>fps ${m.fps??'-'} · 偵測 ${m.detections_per_min??'-'}/min · ${m.stream_connected?'連線':'中斷'}</span></div>`}).join('');
  const e=await J('/api/escalations'),now=Date.now()/1000;
  const op=e.filter(x=>x.to_who==='operator'),en=e.filter(x=>x.to_who==='engineer');
  $('op').innerHTML=op.map(x=>`<div class="esc"><b>${x.kind==='confirm_rollback'?'🔁 確認 rollback':'🛠 請求現場協助'}</b>${x.deadline?` <span class="badge">${Math.max(0,Math.round(x.deadline-now))}s</span>`:''}<div>${esc(x.text)}</div><div class="row">${x.kind==='assist'?`<button class="pri" onclick="resp(${x.id},'fixed')">已處理</button><button class="dng" onclick="resp(${x.id},'cannot')">無法處理</button>`:`<button class="pri" onclick="resp(${x.id},'confirm')">確認 rollback</button><button onclick="resp(${x.id},'reject')">取消</button>`}</div></div>`).join('')||'<div class="empty">無待處理請求</div>';
  $('eng').innerHTML=en.map(x=>{const p=x.payload;return `<div class="esc eng"><b>🚨 Incident #${x.issue_id}</b><div>${esc(x.text)}</div><pre>${esc(p.summary)}\n\n建議：${esc(p.suggestion)}\n已嘗試：${esc(p.actions.map(a=>a.tool+'('+a.status+')').join('、')||'無')}\n\n時間軸：\n${esc(p.timeline.join('\n'))}\n\nLogs：\n${esc(p.recent_logs.join('\n'))}</pre><div class="row"><button class="pri" onclick="resp(${x.id},'fixed')">工程師已修復</button></div></div>`}).join('')||'<div class="empty">無升級事件</div>';
 }catch(e){}}
boot();setInterval(poll,1500);poll();
</script></body></html>
