services:
  sim:
    image: aicam/sim:0.2
    build: ./sim
    mem_limit: 256m
    read_only: true
    environment:
      AGENT_URL: http://agent:8000
      SIM_RECONNECT_RETRIES: ${SIM_RECONNECT_RETRIES:-3}   # reconnect 失敗訊息中的重試次數（可在 .env 調整）
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      retries: 10
  agent:
    image: aicam/agent:0.2
    build:
      context: .
      dockerfile: agent/Dockerfile
    mem_limit: 768m
    read_only: true
    tmpfs: [/tmp]
    env_file: [.env]
    environment:
      SIM_URL: http://sim:8001
      DB_PATH: /data/agent.db
    ports: ["8000:8000"]
    volumes:
      - agent-data:/data
      - ./config:/app/config:ro   # 可直接編輯 TOML，再熱重載
      - ./.env:/app/.env:ro       # Reset 時重新讀取 LLM 設定（不必重啟容器）
    depends_on:
      sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10
volumes:
  agent-data:
